[package]
name = "ecore-launcher"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Fail-closed Linux desktop application launcher for reliably detected E-cores"
license = "MIT"
readme = "README.md"
keywords = ["linux", "desktop", "launcher", "cpu", "topology"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
clap = { version = "=4.5.51", default-features = false, features = [
    "derive",
    "error-context",
    "help",
    "std",
    "suggestions",
    "usage",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
toml = "0.8"
fs2 = "0.4"
ioprio = { version = "=0.2.0", default-features = false }
# toml_edit's open range otherwise resolves to indexmap 2.14 (Rust 1.85).
indexmap = { version = "=2.11.4", default-features = false }
nix = { version = "=0.29.0", default-features = false, features = ["fs", "process", "sched", "signal"] }
rustix = { version = "=1.1.4", default-features = false, features = ["process", "std"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
